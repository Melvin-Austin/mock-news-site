<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Civics Project</title>

<style>
:root {
    --main-red:#8b0000;
    --gold:#e6c34a;       /* brighter gold (still used for theme if needed) */
    --content-bg:#d9d9d9; /* darker gray */
}

body {
    font-family: Arial;
    margin: 0;
    background: #f2f2f2;
}

header {
    background: var(--main-red);
    color: white;
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
    text-align: center;
}

/* Centered nav bar */
#headlineBar {
    background: #000;
    color: white;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

#headlineBar a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
}

#headlineBar a:hover {
    text-decoration: underline;
}

/* Search bar */
#searchBarContainer {
    background: var(--main-red);
    padding: 10px;
    text-align: center;
}

#searchBar {
    width: 60%;
    padding: 10px;
    font-size: 16px;
    border: 2px solid #000;
    border-radius: 0;
}

/* Page layout */
.page-container {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 15px 40px 15px;
}

/* Slightly darker content box */
.content {
    width: 70%;
    margin: auto;
    background: var(--content-bg);
    padding: 20px;
    border-radius: 6px;
}

/* Video container */
.video-container {
    text-align: center;
    margin-top: 15px;
}

video, iframe {
    border-radius: 6px;
}

/* Script box */
#script-box {
    background: white;
    padding: 20px;
    border-radius: 6px;
    border: 1px solid #aaa;
    margin-top: 20px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<header>Civics Project</header>

<div id="headlineBar">
    <a href="todays-headlines.html">Todays Headlines</a>
    <a href="civics-project.html">Civics Project</a>
    <a href="current-weather-report.html">Current Weather Report</a>
</div>

<!-- Search bar -->
<div id="searchBarContainer">
    <input id="searchBar" type="text" placeholder="Search the site...">
</div>

<div class="page-container">
<div class="content">

<h2>Civics News For Canadians:</h2>

<div class="video-container">
    <iframe 
        width="560" 
        height="315"
        src="https://www.youtube.com/embed/Z0PBYexKEEs"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<h2 style="margin-top:40px;">Civics Script</h2>

<pre id="script-box">Loading script...</pre>

</div>
</div>

<script>
fetch("Mock_News_Script.txt")
    .then(r => r.text())
    .then(t => document.getElementById("script-box").textContent = t)
    .catch(() => {
        document.getElementById("script-box").textContent =
            "Error loading script.";
    });

// Search bar behavior
document.getElementById("searchBar").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        let value = this.value.toLowerCase().trim();

        // You can change this to anything you want later
        if (value === "remove-ads") {
            alert("There are no ads on this page.");
        }

        this.value = "";
    }
});
</script>

</html>
