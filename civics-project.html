<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Civics Project</title>

<style>
:root { --main-red:#8b0000; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f2f2;
}

/* Header */
header {
    background: var(--main-red);
    color: white;
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
    text-align: center;
}

/* Navigation */
#headlineBar {
    background: #000;
    color: white;
    padding: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

#headlineBar a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
}

#headlineBar a:hover {
    text-decoration: underline;
}

/* Search bar */
.search-bar {
    margin: 20px auto;
    text-align: center;
}

.search-bar input {
    width: 60%;
    padding: 10px;
    border: 2px solid var(--main-red);
    border-radius: 0;
}

.search-bar button {
    padding: 10px 20px;
    background: var(--main-red);
    color: white;
    border: none;
}

/* Ad box */
.ad-box {
    background: var(--main-red);
    color: white;
    padding: 15px;
    width: 300px;
    margin: 20px auto;
    text-align: center;
    border-radius: 0;
    font-weight: bold;
}

/* Main content */
.content {
    width: 70%;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 6px;
}

/* Script box */
#script-box {
    background: #eee;
    padding: 20px;
    border: 1px solid #ccc;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<header>Civics Project</header>

<div id="headlineBar">
    <a href="todays-headlines.html">Todays Headlines</a>
    <a href="civics-project.html">Civics Project</a>
    <a href="current-weather-report.html">Current Weather Report</a>
</div>

<div class="search-bar">
    <input type="text" placeholder="Search the site...">
    <button>Search</button>
</div>

<div class="ad-box">
    BUY THIS THING YOU DON'T NEED
</div>

<div class="content">

    <h2>Video Presentation</h2>

    <div style="text-align:center;">
        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>

    <h2 style="margin-top:40px;">Civics Script</h2>
    <pre id="script-box">Loading script...</pre>

</div>

<script>
fetch("Mock_News_Script.txt")
    .then(r => r.text())
    .then(t => document.getElementById("script-box").textContent = t)
    .catch(() => document.getElementById("script-box").textContent = "Error loading script.");
</script>

</body>
</html>
