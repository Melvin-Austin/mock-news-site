<script>
const weatherDescriptions = {
    0: "Clear sky",
    1: "Mainly clear",
    2: "Partly cloudy",
    3: "Overcast",
    45: "Fog",
    48: "Depositing rime fog",
    51: "Light drizzle",
    53: "Moderate drizzle",
    55: "Dense drizzle",
    61: "Light rain",
    63: "Moderate rain",
    65: "Heavy rain",
    71: "Light snow",
    73: "Moderate snow",
    75: "Heavy snow",
    95: "Thunderstorm",
    96: "Thunderstorm with hail"
};

function fetchWeather(lat, lon) {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m,pressure_msl,visibility`)
        .then(res => res.json())
        .then(data => {
            const w = data.current_weather;
            const hourly = data.hourly;

            const humidity = hourly.relativehumidity_2m[0];
            const pressure = hourly.pressure_msl[0];
            const visibility = hourly.visibility[0] / 1000; // convert to km

            document.getElementById("weatherBox").innerHTML = `
                <strong>Temperature:</strong> ${w.temperature}°C<br>
                <strong>Feels Like:</strong> ${w.temperature}°C<br>
                <strong>Wind Speed:</strong> ${w.windspeed} km/h<br>
                <strong>Wind Direction:</strong> ${w.winddirection}°<br>
                <strong>Conditions:</strong> ${weatherDescriptions[w.weathercode] || "Unknown"}<br>
                <strong>Humidity:</strong> ${humidity}%<br>
                <strong>Pressure:</strong> ${pressure} hPa<br>
                <strong>Visibility:</strong> ${visibility} km<br>
                <strong>Time:</strong> ${w.time}
            `;
        })
        .catch(() => {
            document.getElementById("weatherBox").innerHTML = "Unable to load weather data.";
        });
}

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => fetchWeather(45, -66)
    );
} else {
    fetchWeather(45, -66);
}
</script>
