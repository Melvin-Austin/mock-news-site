<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Current Weather Report</title>

<style>
:root { --main-red:#8b0000; }

body {
    font-family: Arial;
    margin: 0;
    background: #f2f2f2;
}

header {
    background: var(--main-red);
    color: white;
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
    text-align: center;
}

/* Centered nav bar */
#headlineBar {
    background: #000;
    color: white;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

#headlineBar a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
}

#headlineBar a:hover {
    text-decoration: underline;
}

/* Search bar */
#searchBarContainer {
    background: var(--main-red);
    padding: 10px;
    text-align: center;
}

#searchBar {
    width: 60%;
    padding: 10px;
    font-size: 16px;
    border: 2px solid #000;
    border-radius: 0;
}

/* Main content box */
.content {
    width: 70%;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* Weather box */
.weather-box {
    background: #f7f7f7;
    padding: 20px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 20px;
}

.weather-title {
    font-size: 24px;
    font-weight: bold;
    color: var(--main-red);
    margin-bottom: 10px;
}

.weather-detail {
    font-size: 18px;
    margin: 6px 0;
}

/* Manual input */
#manualInput {
    width: 60%;
    padding: 10px;
    font-size: 16px;
    border: 2px solid var(--main-red);
    border-radius: 0;
    margin-top: 15px;
}

#manualBtn {
    padding: 10px 20px;
    background: var(--main-red);
    color: white;
    border: none;
    margin-left: 10px;
}
</style>
</head>

<body>

<header>Current Weather Report</header>

<div id="headlineBar">
    <a href="todays-headlines.html">Todays Headlines</a>
    <a href="civics-project.html">Civics Project</a>
    <a href="current-weather-report.html">Current Weather Report</a>
</div>

<div id="searchBarContainer">
    <input id="searchBar" type="text" placeholder="Search the site...">
</div>

<div class="content">

    <h2>Local Weather Update</h2>
    <p>This page detects your location or lets you enter one manually.</p>

    <!-- Location box -->
    <div id="location-box"
         style="background:#f7f7f7; padding:15px; border:1px solid #ccc; border-radius:6px; margin-top:20px;">
         Detecting your location…
    </div>

    <!-- Manual input -->
    <div style="margin-top:20px; text-align:center;">
        <input id="manualInput" type="text" value="city, region, country">
        <button id="manualBtn">Use Location</button>
    </div>

    <!-- Weather output -->
    <div class="weather-box" id="weather-output" style="display:none;">
        <div class="weather-title">Weather</div>
        <div class="weather-detail" id="w-temp"></div>
        <div class="weather-detail" id="w-cond"></div>
        <div class="weather-detail" id="w-wind"></div>
    </div>

</div>

<script>
// Remove placeholder text on click
const manualInput = document.getElementById("manualInput");
manualInput.addEventListener("focus", () => {
    if (manualInput.value === "city, region, country") {
        manualInput.value = "";
    }
});

// Restore placeholder if empty on blur
manualInput.addEventListener("blur", () => {
    if (manualInput.value.trim() === "") {
        manualInput.value = "city, region, country";
    }
});

// Fake weather generator
function showWeather(locationName) {
    document.getElementById("weather-output").style.display = "block";
    document.getElementById("w-temp").textContent = "Temperature: 14°C";
    document.getElementById("w-cond").textContent = "Condition: Mostly Cloudy";
    document.getElementById("w-wind").textContent = "Wind: 12 km/h NW";

    document.getElementById("location-box").innerHTML =
        "Location: " + locationName;
}

// Manual input button
document.getElementById("manualBtn").addEventListener("click", () => {
    let loc = manualInput.value.trim();
    if (loc !== "" && loc !== "city, region, country") {
        showWeather(loc);
    }
});

// Geolocation success
function successLocation(position) {
    const lat = position.coords.latitude.toFixed(4);
    const lon = position.coords.longitude.toFixed(4);

    showWeather("GPS Location (" + lat + ", " + lon + ")");
}

// Fallback to IP
function fallbackToIP() {
    fetch("https://ipapi.co/json/")
        .then(res => res.json())
        .then(data => {
            showWeather(data.city + ", " + data.region);
        })
        .catch(() => {
            document.getElementById("location-box").innerHTML =
                "Unable to determine location.";
        });
}

// Try geolocation first
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            successLocation,
            fallbackToIP
        );
    } else {
        fallbackToIP();
    }
}

window.onload = getLocation;
</script>

</body>
</html>
